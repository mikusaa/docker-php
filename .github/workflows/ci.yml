name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Select PHP build source
        run: echo "PHP_FROM=$(sh ./tests/php-version.sh --base)" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image
          set: |
            *.platform=${{ matrix.platform }}
            image.output=type=docker
            image.tags=docker-php:test-${{ matrix.suffix }}
            image.cache-from=type=gha,scope=ci-${{ matrix.suffix }}
            image.cache-to=type=gha,mode=max,scope=ci-${{ matrix.suffix }}
            php-security-source.cache-from=type=gha,scope=php-security-${{ matrix.suffix }}
            php-security-source.cache-to=type=gha,mode=max,scope=php-security-${{ matrix.suffix }}

      - name: Run smoke tests
        run: ./tests/smoke.sh docker-php:test-${{ matrix.suffix }} ${{ matrix.platform }}
