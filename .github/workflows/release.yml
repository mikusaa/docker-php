name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test release (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag matches PHP version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          image_version="$(sh ./tests/php-version.sh)"
          if [[ -z "$image_version" || "$release_version" != "$image_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Dockerfile PHP version $image_version" >&2
            exit 1
          fi
          echo "PHP_FROM=$(sh ./tests/php-version.sh --base)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image
          set: |
            *.platform=${{ matrix.platform }}
            image.output=type=docker
            image.tags=docker-php:release-${{ matrix.suffix }}
            image.cache-from=type=gha,scope=ci-${{ matrix.suffix }}
            image.cache-to=type=gha,mode=max,scope=ci-${{ matrix.suffix }}
            php-security-source.cache-from=type=gha,scope=php-security-${{ matrix.suffix }}
            php-security-source.cache-to=type=gha,mode=max,scope=php-security-${{ matrix.suffix }}

      - name: Run smoke tests
        run: ./tests/smoke.sh docker-php:release-${{ matrix.suffix }} ${{ matrix.platform }}

  publish:
    name: Publish multi-platform image
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/mikusa/docker-php
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}-fpm-alpine
            type=semver,pattern={{major}}.{{minor}}-fpm-alpine
            type=raw,value=latest

      - name: Select PHP build source
        run: echo "PHP_FROM=$(sh ./tests/php-version.sh --base)" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.metadata.outputs.bake-file }}
          targets: image
          set: |
            *.platform=linux/amd64
            *.platform+=linux/arm64
            image.output=type=registry
            image.cache-from=type=gha,scope=release
            image.cache-from+=type=gha,scope=ci-amd64
            image.cache-from+=type=gha,scope=ci-arm64
            image.cache-to=type=gha,mode=max,scope=release
            php-security-source.cache-from=type=gha,scope=php-security-amd64
            php-security-source.cache-from+=type=gha,scope=php-security-arm64
          provenance: mode=max
          sbom: true
